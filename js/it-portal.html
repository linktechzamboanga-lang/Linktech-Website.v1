<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

LinkTech Customer Support Portal

<link rel="stylesheet" href="css/it-portal.css">


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">


<!-- Google Identity Service -->
<script src="https://accounts.google.com/gsi/client" async defer></script>


<meta name="theme-color" content="#050a19">


<meta name="description"
content="LinkTech Customer Support Portal - Freelance IT Specialist Zamboanga">


</head>


<body>


<header>


<div class="logo">

<img src="images/LinkTech-logo.png"
alt="LinkTech Logo">

<b>
LinkTech
</b>

</div>


<nav>

<a href="index.html">
Customer Support
</a>

Services

<a href="it-portal.html">

About

</nav>
</header>

<!-- HERO -->


<section class="hero">


<h1>
IT-Portal
</h1>

<h2>
Freelance IT Specialist Zamboanga
</h2>
</section>

<!-- ==========================
ADMIN LOGIN
========================== -->

<section class="intro">
<p>
Administrator Access Only
</p>
</section>
<div id="loginPage"
class="login-page">


<div class="login-card">

<div id="g_id_onload"

data-client_id="YOUR_GOOGLE_CLIENT_ID"

data-callback="handleGoogleLogin"

data-auto_prompt="false">

</div>




<div class="g_id_signin"

data-type="standard"

data-size="large"

data-theme="outline"

data-text="signin_with"

data-shape="rectangular">

</div>




<p id="loginStatus"></p>


</div>


</div>







<!-- ==========================
MAIN PORTAL
========================== -->


<div id="portalPage"
style="display:none;">





<header class="header">


<div class="brand">


<img src="images/LinkTech-logo.png">


<h2>
LinkTech IT Portal
</h2>


</div>



<div class="admin-info">


<span id="adminName">

Admin

</span>



<button onclick="logout()">

Logout

</button>


</div>



</header>








<!-- ==========================
MENU
========================== -->


<nav class="navigation">


<button onclick="openSection('helpTool')">

Help Tool

</button>



<button onclick="openSection('schedule')">

Schedule

</button>



<button onclick="openSection('messages')">

Messages

</button>



<button onclick="openSection('aiHelp')">

AI Help

</button>


</nav>










<!-- ==========================
HELP TOOL
========================== -->


<section id="helpTool"
class="portal-section">


<h2>
IT Troubleshooting Knowledge Base
</h2>



<div class="toolbar">


<input
type="search"
id="searchHelp"
placeholder="Search title or troubleshooting report...">



<button onclick="openReportForm()">

Add Report

</button>



</div>




<div id="reportForm"
class="form-container"
style="display:none;">



<h3>
New IT Report
</h3>



<input
id="reportTitle"
placeholder="Title">



<input
id="reportCategory"
placeholder="Category">



<textarea
id="reportCaption"
placeholder="Troubleshooting steps / solution">
</textarea>



<button onclick="saveReport()">

Save

</button>


<button onclick="closeReportForm()">

Cancel

</button>


</div>





<div id="helpList">


</div>



</section>









<!-- ==========================
IT SCHEDULE
========================== -->


<section id="schedule"

class="portal-section"

style="display:none;">



<h2>
IT Personnel Schedule
</h2>




<div class="schedule-form">


<input
id="personnel"
placeholder="Assigned IT Personnel">



<input
id="location"
placeholder="Location">



<input
id="purpose"
placeholder="Purpose">



<input
type="date"
id="scheduleDate">



<input
type="time"
id="scheduleTime">



<button>

Send Schedule

</button>


</div>



<div id="calendar">

Calendar

</div>


</section>









<!-- ==========================
EMAIL MESSAGES
========================== -->


<section id="messages"

class="portal-section"

style="display:none;">



<h2>
Sent Inbox
</h2>




<div class="message-box">


<input
id="receiverEmail"
placeholder="Email recipient">



<textarea
id="messageContent"
placeholder="Message">

</textarea>



<button>

Send Email

</button>



</div>




<div id="messageList">

</div>



</section>









<!-- ==========================
AI HELP
========================== -->


<section id="aiHelp"

class="portal-section"

style="display:none;">



<h2>
AI IT Assistant
</h2>




<div class="chat-container">


<div id="chatMessages">

</div>




<div class="chat-input">


<input
id="aiQuestion"

placeholder="Ask IT troubleshooting question...">



<button>

Send

</button>


</div>



</div>



</section>







</div>







<script>


// =================================
// BASIC PORTAL CONTROL
// =================================


const ADMIN_EMAIL =
"linktechzamboanga@gmail.com";



function handleGoogleLogin(response){


console.log(
"Google Login Token:",
response.credential
);


// Verification will be added
// in JS Part 5/7


}





function openSection(id){


document
.querySelectorAll(".portal-section")
.forEach(section=>{


section.style.display="none";


});



document
.getElementById(id)
.style.display="block";


}





function logout(){


localStorage.clear();

location.reload();


}



</script>



</body>

</html>
